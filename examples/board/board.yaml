kardboard: 1
id: demo
name: Demo project
sync: none

columns:
  - id: planning
    title: Planning
  - id: backlog
    title: Backlog
  - id: working_on
    title: In progress
    doing: true
    limit: 3
  - id: done
    title: Done
    done: true

fields:
  assignee:
    type: person
    required: [working_on]
  size:
    title: Size
    type: enum
    values: [XS, S, M, L, XL]
    required: [backlog, working_on]
  milestone:
    title: Milestone
    type: enum
    values: [pilot, release, later]
  tags:
    type: list
    values: [bug, feature, cleanup, security, ui]
